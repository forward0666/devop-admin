apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-console
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/forward0666/devop-admin.git
    targetRevision: HEAD
    path: cloud-console
  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-console
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
