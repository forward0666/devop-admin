apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-admin-ui.fullname" . }}
  labels:
    app: {{ include "devops-admin-ui.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "devops-admin-ui.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "devops-admin-ui.name" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          env:
            - name: TZ
              value: "{{ .Values.timezone }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
