replicaCount: 1

image:
  repository: registry.cn-hangzhou.aliyuncs.com/devops-admin/devops-admin-ui
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: aliyun-registry

service:
  type: ClusterIP
  port: 80

timezone: Asia/Shanghai

resources:
  requests:
    memory: 64Mi
    cpu: 100m
  limits:
    memory: 128Mi
    cpu: 200m

ingress:
  enabled: true
  className: nginx
  host: u8-web-test.gfkdf.com
  path: /
  annotations:
    kubernetes.io/ingress.class: nginx
  tls:
    - hosts:
        - u8-web-test.gfkdf.com
